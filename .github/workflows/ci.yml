name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-app } }
    steps:
      - uses: actions/checkout@v4
        with: { path: ai-app }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ai-app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The browser tests start the real API, which is in the other repository. They run when the repository variable
      # API_REPOSITORY (owner/name) is set. A private API repository also needs the secret API_REPO_TOKEN, a read-only token.
      - name: Get the API
        if: vars.API_REPOSITORY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY }}
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
          path: ai-api
      - name: Install the API
        if: vars.API_REPOSITORY != ''
        run: npm ci
        working-directory: ai-api
      - name: Browser tests (the runner image has Chrome)
        if: vars.API_REPOSITORY != ''
        run: npm test
